[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "in-house-legal-intelligence"
version = "1.0.0"
description = "In-House Legal Intelligence System: Pretraining, NER, Rhetorical Roles, Judgment Prediction, Statute Identification, Summarization, and Prior Case Retrieval (IIT Kanpur CS781 Capstone)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ayush Mishra", email = "6343.ayushmishra@gmail.com" }
]
keywords = [
    "legal-nlp",
    "language-models",
    "named-entity-recognition",
    "peft",
    "court-judgment-prediction",
    "legal-summarization",
    "information-retrieval",
    "indian-law"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Legal Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11"
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "scikit-learn>=1.0.0",
    "tqdm>=4.64.0"
]

[project.optional-dependencies]
dev = [
    "flake8>=6.0.0",
    "pytest>=7.0.0"
]
full = [
    "transformers>=4.30.0",
    "datasets>=2.12.0",
    "accelerate>=0.20.0",
    "peft>=0.4.0",
    "evaluate>=0.4.0",
    "bert-score>=0.3.13",
    "rouge-score>=0.1.2"
]

[project.urls]
"Homepage" = "https://github.com/Ayush-Mishra6343/CS781"
"Repository" = "https://github.com/Ayush-Mishra6343/CS781"
"Academic Institution" = "https://www.iitk.ac.in"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
